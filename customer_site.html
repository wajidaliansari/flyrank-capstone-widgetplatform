<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Blog - Widget Test</title>
    <style>
        body { font-family: sans-serif; padding: 2rem; background-color: #f9fafb; }
        .widget-container { background: white; padding: 2rem; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); max-width: 400px; margin-top: 2rem; }
        input, button { display: block; width: 100%; margin-bottom: 1rem; padding: 0.5rem; }
        .hidden { display: none; }
    </style>
</head>
<body>
    <h1>Welcome to My Awesome Blog</h1>
    <p>This is a website completely separate from our API.</p>

    <!-- The Embeddable Widget -->
    <div class="widget-container" id="my-widget">
        <h3 id="widget-title">Loading Widget...</h3>
        <form id="lead-form">
            <input type="text" id="name" placeholder="Your Name" required>
            <input type="email" id="email" placeholder="Your Email" required>
            <!-- The Honeypot -->
            <input type="text" id="honeypot" class="hidden" autocomplete="off">
            <button type="submit">Subscribe Now</button>
        </form>
        <p id="status-message"></p>
    </div>

    <script>
        const API_BASE = "http://127.0.0.1:8000";
        const WIDGET_ID = 3; // Assuming we created a widget with ID 1

        // 1. Fetch the cached config
        fetch(`${API_BASE}/widgets/${WIDGET_ID}/config`)
            .then(res => res.json())
            .then(data => {
                document.getElementById('widget-title').innerText = `Join ${data.name}`;
            })
            .catch(err => document.getElementById('widget-title').innerText = "Widget Unavailable");

        // 2. Handle the cross-origin form submission
        document.getElementById('lead-form').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const payload = {
                widget_id: WIDGET_ID,
                name: document.getElementById('name').value,
                email: document.getElementById('email').value,
                honeypot_field: document.getElementById('honeypot').value
            };

            fetch(`${API_BASE}/submissions`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(payload)
            })
            .then(res => {
                if(res.status === 429) throw new Error("Too many requests. Please slow down.");
                if(!res.ok) throw new Error("Invalid email or submission failed.");
                return res.json();
            })
            .then(data => {
                document.getElementById('status-message').innerText = "Success! You are subscribed.";
                document.getElementById('status-message').style.color = "green";
            })
            .catch(error => {
                document.getElementById('status-message').innerText = error.message;
                document.getElementById('status-message').style.color = "red";
            });
        });
    </script>
</body>
</html>
